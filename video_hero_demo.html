<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Prosthetics — Hero Section</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f0f0ee] antialiased">
  <div class="relative min-h-screen overflow-hidden bg-[#f0f0ee]">
    <!-- Background Video -->
    <video
      autoplay
      muted
      loop
      playsinline
      class="absolute inset-0 w-full h-full object-cover"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_215831_c6a8989c-d716-4d8d-8745-e972a2eec711.mp4"
    ></video>

    <!-- Foreground Content Wrapper -->
    <div class="relative z-10 flex flex-col min-h-screen">
      <!-- Navbar (centered, pill-style, two separate pills) -->
      <nav class="flex items-center justify-center pt-4 sm:pt-6 px-4 sm:px-8 gap-2 sm:gap-3">
        <!-- Left circular logo container -->
        <div
          class="flex items-center justify-center rounded-full w-10 h-10 sm:w-11 sm:h-11 shrink-0 shadow-sm"
          style="background-color: #EDEDED;"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 256 256"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill="rgb(84, 84, 84)"
              d="M 160 88 L 194 34 L 216 0 L 256 0 L 256 40 L 221.5 93.5 L 200 128 L 256 128 L 256 256 L 96 256 L 96 168 L 64.246 220 L 40 256 L 0 256 L 0 216 L 34 162 L 56 128 L 0 128 L 0 0 L 160 0 Z"
            />
          </svg>
        </div>

        <!-- Right pill container -->
        <div
          class="flex items-center gap-4 sm:gap-10 rounded-xl px-4 sm:px-8 py-2.5 sm:py-3 shadow-sm"
          style="background-color: #EDEDED;"
        >
          <a href="#story" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Story</a>
          <a href="#products" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Products</a>
          <a href="#help" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Help</a>
          <a href="#support" class="text-[12px] sm:text-[14px] font-medium text-gray-700 hover:text-gray-900 transition-colors duration-200">Support</a>
        </div>
      </nav>

      <!-- Hero content (bottom-left aligned) -->
      <div class="flex-1 flex items-end pb-10 sm:pb-16 lg:pb-20 px-6 sm:px-12 md:px-20 lg:px-28">
        <div class="max-w-xs">
          <!-- 1. Badge link -->
          <a
            href="#shark-tank"
            class="inline-flex items-center gap-1.5 text-[11.5px] font-medium text-blue-500 hover:text-blue-600 transition-colors mb-3 group"
          >
            <span>Seen on Shark Tank in India</span>
            <span class="inline-block transition-transform duration-200 group-hover:translate-x-0.5">
              →
            </span>
          </a>

          <!-- 2. Headline -->
          <h1 class="text-[1.5rem] sm:text-[1.75rem] leading-[1.15] font-medium text-gray-900 tracking-tight mb-3">
            Simple, smart prosthetics made for people who keep fighting.
          </h1>

          <!-- 3. Subtext -->
          <p class="text-[13px] text-gray-400 font-normal mb-3">
            Reclaim your movement now.
          </p>

          <!-- 4. CTA anchor -->
          <a
            href="#fitting"
            class="inline-flex items-center gap-2 text-[13px] font-medium text-blue-500 border border-blue-400 rounded-full px-5 py-2.5 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all duration-200 group"
          >
            <span>Try a free fitting</span>
            <span class="inline-block transition-transform duration-200 group-hover:translate-x-0.5">
              →
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
